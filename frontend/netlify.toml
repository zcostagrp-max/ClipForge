# Netlify config for ClipForge frontend
# IMPORTANT: In Netlify UI set Base directory = "frontend"
# Then this file is read from inside frontend/

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"
