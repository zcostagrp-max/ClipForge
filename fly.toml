# fly.toml app configuration file generated for clipforge-ynsm7w on 2026-11-23T15:12:50Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'clipforge-ynsm7w'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8000'
  STORAGE_PATH = '/app/storage'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
